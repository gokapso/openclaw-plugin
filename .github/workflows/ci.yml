name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test
      - run: npm pack --dry-run
      - name: Check packaged postinstall without OpenClaw
        run: |
          package_dir="$(mktemp -d)"
          npm pack --pack-destination "$package_dir"
          tar -xzf "$package_dir"/*.tgz -C "$package_dir"
          npm --prefix "$package_dir/package" run postinstall
